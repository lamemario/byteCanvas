<!DOCTYPE html>
<html>
<head>
  <title>NUS Secure Access</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icons/icon48.png" alt="ByteCanvas Logo">
      <h1>NUS Secure Access</h1>
    </div>

    <div class="status-container">
      <div id="status" class="status">Scanning...</div>
      <button id="scanButton" class="scan-button">Scan Now</button>
    </div>

    <div class="results-container">
      <div class="tabs">
        <button class="tab-button active" data-tab="all">All</button>
        <button class="tab-button" data-tab="safe">Safe</button>
        <button class="tab-button" data-tab="warning">Warnings</button>
        <button class="tab-button" data-tab="danger">Danger</button>
      </div>
      <div id="results" class="results">
        <div class="scan-message">Click "Scan Now" to check the page</div>
      </div>
    </div>

    <div class="report-section">
      <h2 style="display: flex; align-items: center; gap: 8px;">
        <span class="material-icons">report</span>
        Report Suspicious Link
      </h2>
      <form class="report-form" onsubmit="return false;">
        <input type="text" id="reportLink" class="report-input" placeholder="Enter suspicious URL">
        <button id="reportButton" class="report-button" type="button">
          <span class="material-icons">send</span>
        </button>
      </form>
    </div>

    <div class="tips-section">
      <h2 style="display: flex; align-items: center; gap: 8px;">
        <span class="material-icons">lightbulb</span>
        NUS Phishing Tips
      </h2>
      <div id="tips" class="tips"></div>
    </div>

    <footer>
      <p>Protecting NUS students from phishing attacks</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>

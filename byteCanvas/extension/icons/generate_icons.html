<!DOCTYPE html>
<html>
<head>
    <title>Generate Extension Icons</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .icon-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .icon-preview {
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }
        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #1557b0;
        }
    </style>
</head>
<body>
    <h1>Extension Icon Generator</h1>
    <div class="icon-container">
        <div class="icon-preview">
            <canvas id="icon16" width="16" height="16"></canvas>
            <div>16x16</div>
        </div>
        <div class="icon-preview">
            <canvas id="icon48" width="48" height="48"></canvas>
            <div>48x48</div>
        </div>
        <div class="icon-preview">
            <canvas id="icon128" width="128" height="128"></canvas>
            <div>128x128</div>
        </div>
    </div>
    <button onclick="downloadIcons()">Download Icons</button>

    <script>
        // Load the SVG
        fetch('icon.svg')
            .then(response => response.text())
            .then(svgText => {
                const parser = new DOMParser();
                const svgDoc = parser.parseFromString(svgText, 'image/svg+xml');
                const svgElement = svgDoc.documentElement;

                // Generate icons in different sizes
                generateIcon(16, 'icon16');
                generateIcon(48, 'icon48');
                generateIcon(128, 'icon128');
            });

        function generateIcon(size, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Create a temporary SVG element
            const tempSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            tempSvg.setAttribute('width', size);
            tempSvg.setAttribute('height', size);
            tempSvg.setAttribute('viewBox', '0 0 128 128');
            
            // Add the shield path
            const shield = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            shield.setAttribute('d', 'M64 8L16 32v32c0 35.2 20.8 68.8 48 80 27.2-11.2 48-44.8 48-80V32L64 8z');
            shield.setAttribute('fill', '#1a73e8');
            tempSvg.appendChild(shield);
            
            // Add the checkmark
            const checkmark = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            checkmark.setAttribute('d', 'M48 64l16 16 32-32');
            checkmark.setAttribute('stroke', 'white');
            checkmark.setAttribute('stroke-width', '8');
            checkmark.setAttribute('fill', 'none');
            checkmark.setAttribute('stroke-linecap', 'round');
            checkmark.setAttribute('stroke-linejoin', 'round');
            tempSvg.appendChild(checkmark);
            
            // Convert SVG to data URL
            const svgData = new XMLSerializer().serializeToString(tempSvg);
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(svgData);
        }

        function downloadIcons() {
            const sizes = [16, 48, 128];
            sizes.forEach(size => {
                const canvas = document.getElementById(`icon${size}`);
                const link = document.createElement('a');
                link.download = `icon${size}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
